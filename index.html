<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razvanoss Calculator - FiveM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            width: 100%;
            max-width: 450px;
            background: #131c2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 255, 204, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid #2d3748;
            color: #94a3b8;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #00ffcc;
            color: #0b0f19;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .calc-section {
            display: none;
        }

        .calc-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #1e293b;
            color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .result-box {
            margin-top: 20px;
            background: #0b0f19;
            border: 1px dashed #00ffcc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .result-title {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h1>Razvanoss Calculator</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('bullets')">Gloanțe</button>
            <button class="mode-btn" onclick="switchMode('tec')">Armă TEC</button>
        </div>

        <!-- Secțiunea Gloanțe -->
        <div id="bullets-section" class="calc-section active">
            <div class="input-group">
                <label>Număr Batches (50 gloanțe / batch)</label>
                <input type="number" id="bulletBatches" value="1" min="1" oninput="calculateBullets()">
            </div>
            <div class="input-group">
                <label>Preț per bucată material (Cupru / Sulf)</label>
                <input type="number" id="bulletMatPrice" value="1500" oninput="calculateBullets()">
            </div>
            
            <div class="result-box">
                <div class="result-title">Cost Total Gloanțe</div>
                <div class="result-value" id="bulletTotal">12,000 $</div>
            </div>
        </div>

        <!-- Secțiunea TEC -->
        <div id="tec-section" class="calc-section">
            <div class="input-group">
                <label>Număr Arme TEC</label>
                <input type="number" id="tecCount" value="1" min="1" oninput="calculateTec()">
            </div>
            <div class="input-group">
                <label>Preț per bucată material (Fier / Aluminiu)</label>
                <input type="number" id="tecMatPrice" value="1500" oninput="calculateTec()">
            </div>
            
            <div class="result-box">
                <div class="result-title">Cost Total TEC</div>
                <div class="result-value" id="tecTotal">132,000 $</div>
            </div>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.calc-section').forEach(sec => sec.classList.remove('active'));

            if (mode === 'bullets') {
                document.querySelector('.mode-btn:nth-child(1)').classList.add('active');
                document.getElementById('bullets-section').classList.add('active');
            } else {
                document.querySelector('.mode-btn:nth-child(2)').classList.add('active');
                document.getElementById('tec-section').classList.add('active');
            }
        }

        function calculateBullets() {
            let batches = parseFloat(document.getElementById('bulletBatches').value) || 0;
            let price = parseFloat(document.getElementById('bulletMatPrice').value) || 0;
            // 4 cupru + 4 sulf = 8 materiale per batch
            let total = batches * 8 * price;
            document.getElementById('bulletTotal').innerText = total.toLocaleString() + ' $';
        }

        function calculateTec() {
            let count = parseFloat(document.getElementById('tecCount').value) || 0;
            let price = parseFloat(document.getElementById('tecMatPrice').value) || 0;
            // 44 fier + 44 aluminiu = 88 materiale total per TEC
            let total = count * 88 * price;
            document.getElementById('tecTotal').innerText = total.toLocaleString() + ' $';
        }
    </script>

</body>
</html>
