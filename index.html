<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razvanoss Calculator - FiveM</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #0b0f19;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .result-box {
            margin-top: 25px;
            background: #0b0f19;
            border: 1px dashed var(--accent);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .result-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Razvanoss Calculator</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bullets')">Gloanțe</button>
            <button class="tab-btn" onclick="switchTab('tec')">Armă TEC</button>
        </div>

        <!-- Secțiunea Gloanțe -->
        <div id="bullets-section" class="section active">
            <div class="input-group">
                <label>Cantitate Batches (50 gloanțe / batch)</label>
                <input type="number" id="bulletBatches" value="1" min="1" oninput="calculateBullets()">
            </div>
            <div class="input-group">
                <label>Preț per bucată material (Cupru / Sulf - Default: 1500)</label>
                <input type="number" id="bulletMatPrice" value="1500" oninput="calculateBullets()">
            </div>
            
            <div class="result-box">
                <div class="result-title">Cost Total Gloanțe</div>
                <div class="result-value" id="bulletTotal">12,000 $</div>
            </div>
        </div>

        <!-- Secțiunea TEC -->
        <div id="tec-section" class="section">
            <div class="input-group">
                <label>Număr Arme TEC</label>
                <input type="number" id="tecCount" value="1" min="1" oninput="calculateTec()">
            </div>
            <div class="input-group">
                <label>Preț per bucată material (Fier / Aluminiu - Default: 1500)</label>
                <input type="number" id="tecMatPrice" value="1500" oninput="calculateTec()">
            </div>
            
            <div class="result-box">
                <div class="result-title">Cost Total TEC</div>
                <div class="result-value" id="tecTotal">132,000 $</div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'bullets') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('bullets-section').classList.add('active');
            } else {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tec-section').classList.add('active');
            }
        }

        function calculateBullets() {
            let batches = parseFloat(document.getElementById('bulletBatches').value) || 0;
            let price = parseFloat(document.getElementById('bulletMatPrice').value) || 0;
            // 4 cupru + 4 sulf = 8 materiale per batch, fiecare la prețul setat (default 8 * 1500 = 12000)
            let total = batches * 8 * price;
            document.getElementById('bulletTotal').innerText = total.toLocaleString() + ' $';
        }

        function calculateTec() {
            let count = parseFloat(document.getElementById('tecCount').value) || 0;
            let price = parseFloat(document.getElementById('tecMatPrice').value) || 0;
            // 44 fier + 44 aluminiu = 88 materiale total per TEC
            let total = count * 88 * price;
            document.getElementById('tecTotal').innerText = total.toLocaleString() + ' $';
        }
    </script>
